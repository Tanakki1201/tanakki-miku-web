<!DOCTYPE html>
<html lang="ja">
<head>

<!-- MIKU WORLD timing: opening finishes, then wait 1.5 seconds before
     color restoration + a strong background pull begins. -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MIKU WORLD — A world connected by music. An unofficial fan-made Hatsune Miku community concept.">
<title>MIKU WORLD — Unofficial Fan Site</title>
<style>
:root{
  --cyan:#00ffff;
  --white:#fff;
  --bg:#000;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,"Yu Gothic","Meiryo",sans-serif;
}
body{overflow-x:hidden}
button{font:inherit}
.hero{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:620px;
  overflow:hidden;
  background:#000;
}
/* ===== MIKU WORLD layered hero =====
   Static composition: size/placement only. Animation is intentionally deferred.
*/
.world-layers{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:1;
  background:#000;
}
.world-layers img{
  position:absolute;
  display:block;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
.world-universe{
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:1;
}
.world-earth{
  left:8vw;
  top:-2vh;
  width:64vw;
  height:106vh;
  object-fit:contain;
  object-position:center;
  z-index:2;
}
.world-miku{
  right:-5vw;
  bottom:-8vh;
  width:63vw;
  height:108vh;
  object-fit:contain;
  object-position:center bottom;
  z-index:3;
}
.hero-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.hero-shade{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%, rgba(0,0,0,0) 34%, rgba(0,0,0,.10) 68%, rgba(0,0,0,.24) 100%),
    linear-gradient(90deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.06) 34%, rgba(0,0,0,0) 58%);
}
.header{
  position:absolute;
  inset:0 0 auto 0;
  z-index:10;
  height:100px;
}
.menu{
  position:absolute;
  top:25px;
  left:28px;
  width:40px;
  height:32px;
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
}
.menu span{
  display:block;
  width:38px;
  height:3px;
  margin-bottom:8px;
  background:#fff;
  border-radius:99px;
}
.brand{
  position:absolute;
  top:25px;
  left:91px;
}
.brand-main{
  margin:0;
  font-size:20px;
  font-weight:700;
  letter-spacing:5px;
}
.brand-sub{
  margin:4px 0 0;
  font-size:10px;
  font-weight:600;
  letter-spacing:4px;
}
.languages{
  position:absolute;
  top:25px;
  right:30px;
  display:flex;
  gap:25px;
}
.lang{
  border:0;
  background:transparent;
  color:#fff;
  font-size:13px;
  letter-spacing:2px;
  cursor:pointer;
  padding:3px 0 10px;
}
.lang.active{color:var(--cyan)}
.lang{
  position:relative;
}

.lang.active::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-2px;
  transform:translateX(-50%);
  width:22px;
  height:2px;
  margin:0;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
}
.copy{
  position:absolute;
  z-index:6;
  left:3.3%;
  top:27%;
  width:410px;
}
h1{
  margin:0;
  color:#fff;
  font-size:clamp(54px,7vw,110px);
  line-height:.88;
  letter-spacing:9px;
  text-shadow:
    0 0 3px #fff,
    0 0 10px rgba(0,255,255,.80),
    0 0 30px rgba(0,255,255,.45),
    2px 3px 8px rgba(0,0,0,.78);
}
h1 span{display:block}
.subtitle{
  margin:22px 0 0;
  font-size:12px;
  font-weight:700;
  letter-spacing:4px;
  text-shadow:0 2px 7px rgba(0,0,0,.95),0 0 8px rgba(0,255,255,.18);
}
.ja-copy{
  margin:27px 0 0;
  font-size:17px;
  line-height:1.8;
  text-shadow:0 2px 8px rgba(0,0,0,.98),0 0 10px rgba(0,0,0,.55);
}
.rule{
  width:55px;
  height:1px;
  margin:18px 0 0;
  background:#fff;
}
.keywords{
  margin:16px 0 0;
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  line-height:1.8;
  text-shadow:0 2px 8px rgba(0,0,0,.98),0 0 9px rgba(0,0,0,.50);
}
.join-area{
  position:absolute;
  z-index:8;
  left:50%;
  bottom:17%;
  width:390px;
  transform:translateX(-50%);
}
.join{
  width:100%;
  height:62px;
  border:1px solid rgba(0,255,255,.9);
  border-radius:999px;
  background:linear-gradient(180deg, rgba(2,12,22,.72), rgba(0,8,16,.54));
  color:#fff;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:
    0 0 10px rgba(0,255,255,.36),
    0 0 28px rgba(0,255,255,.12),
    inset 0 0 24px rgba(0,255,255,.08),
    inset 0 1px 0 rgba(255,255,255,.18);
}
.join:hover{
  background:linear-gradient(180deg, rgba(2,18,30,.84), rgba(0,10,20,.68));
  box-shadow:
    0 0 18px rgba(0,255,255,.58),
    0 0 42px rgba(0,255,255,.18),
    inset 0 0 28px rgba(0,255,255,.11),
    inset 0 1px 0 rgba(255,255,255,.24);
}
/* A small, unobtrusive rights notice keeps the landing page clear while
   making the unofficial/fan-made status and PCL credit visible. */
.legal-footer{
  position:absolute;
  z-index:12;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(94%,980px);
  text-align:center;
  font-size:9px;
  line-height:1.55;
  letter-spacing:.35px;
  color:rgba(255,255,255,.62);
  text-shadow:0 1px 5px rgba(0,0,0,.98);
}
.legal-footer a{
  color:rgba(255,255,255,.78);
  text-decoration:underline;
  text-underline-offset:2px;
}
.legal-footer a:hover{color:var(--cyan)}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(0,0,0,.76);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:.25s ease;
}
.modal.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.card{
  width:min(560px,100%);
  max-height:88vh;
  overflow:auto;
  padding:38px;
  border:1px solid rgba(0,255,255,.3);
  border-radius:18px;
  background:rgba(2,7,16,.98);
  box-shadow:0 0 50px rgba(0,0,0,.7);
}
.close{
  float:right;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  cursor:pointer;
}
.kicker{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:4px;
}
.card h2{
  margin:8px 0 16px;
  font-size:50px;
  letter-spacing:5px;
}
.card p{
  line-height:1.8;
  color:rgba(255,255,255,.75);
}
.legal-note{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.12);
  font-size:12px;
  color:rgba(255,255,255,.65);
}
.legal-note a{color:var(--cyan)}

/* Cinematic pop-in sequence: the JOIN button appears last. */
.pop-item{
  opacity:0;
  transform:translateY(24px) scale(.94);
  filter:blur(8px);
  animation:mikuPopIn .85s cubic-bezier(.16,1,.3,1) forwards;
  will-change:transform,opacity,filter;
}
.pop-title{animation-delay:.35s}
.pop-subtitle{animation-delay:1.05s}
.pop-message{animation-delay:1.55s}
.pop-keywords{animation-delay:2.55s}
.pop-join{animation-delay:3.55s}
@keyframes mikuPopIn{
  0%{opacity:0;transform:translateY(24px) scale(.94);filter:blur(8px)}
  55%{opacity:1;transform:translateY(-3px) scale(1.015);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@media (prefers-reduced-motion:reduce){
  .pop-item{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}
}
.join.pop-join{
  animation-name:mikuPopIn,mikuJoinGlow;
  animation-duration:.85s,2.2s;
  animation-timing-function:cubic-bezier(.16,1,.3,1),ease-in-out;
  animation-delay:3.55s,4.45s;
  animation-iteration-count:1,infinite;
  animation-direction:normal,alternate;
}
@keyframes mikuJoinGlow{
  from{box-shadow:0 0 10px rgba(0,255,255,.36),0 0 28px rgba(0,255,255,.12),inset 0 0 24px rgba(0,255,255,.08),inset 0 1px 0 rgba(255,255,255,.18)}
  to{box-shadow:0 0 20px rgba(0,255,255,.62),0 0 44px rgba(0,255,255,.22),inset 0 0 30px rgba(0,255,255,.12),inset 0 1px 0 rgba(255,255,255,.25)}
}
@media(max-width:760px){
  .brand{left:72px}
  .brand-main{font-size:15px;letter-spacing:3px}
  .brand-sub{font-size:8px;letter-spacing:2px}
  .languages{right:12px;gap:10px}
  .lang{font-size:10px;letter-spacing:1px}
  .copy{left:6%;top:30%;width:72%}
  h1{font-size:clamp(46px,14vw,76px);letter-spacing:5px}
  .subtitle{font-size:9px;letter-spacing:2px}
  .ja-copy{font-size:14px}
  .join-area{left:50%;bottom:10%;width:min(90%,390px);transform:translateX(-50%)}
  .legal-footer{bottom:6px;font-size:8px;width:94%}
  .card{padding:28px 22px}
  .card h2{font-size:38px}
}
</style>

function setLanguage(lang){
  const data=translations[lang]||translations.ja;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-key]").forEach(el=>{
    const key=el.dataset.key;
    if(data[key]!==undefined) el.innerHTML=data[key];
  });
  document.querySelectorAll(".lang").forEach(btn=>{
    const active=btn.dataset.lang===lang;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",active);
  });
}
document.querySelectorAll(".lang").forEach(btn=>{
  btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
});

window.addEventListener("load",()=>{
  const opening=document.getElementById("opening-screen");
  const header=document.querySelector(".header");
  if(opening){
    setTimeout(()=>opening.classList.add("hide"),3600);
    setTimeout(()=>opening.remove(),4400);
  }

  /* Opening finished: text/menu only, no glass. */
  setTimeout(()=>{
    if(header) header.classList.add("header-ready");
    document.body.classList.add("cinema-start");
  },4450);

  /* Scroll: turn the header into glass. */
  const updateHeader=()=>{
    if(header) header.classList.toggle("header-glass",window.scrollY>80);
  };
  window.addEventListener("scroll",updateHeader,{passive:true});
  updateHeader();
});

const modal=document.getElementById("modal");
const close=document.getElementById("closeButton");
const menu=document.getElementById("menuButton");
if(close) close.addEventListener("click",()=>modal.classList.remove("open"));
if(menu) menu.addEventListener("click",()=>modal.classList.add("open"));
if(modal) modal.addEventListener("click",e=>{
  if(e.target===modal) modal.classList.remove("open");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && modal) modal.classList.remove("open");
});
</script>

<script id="FINAL_COLOR_BACK_PULL_CONTROLLER">
window.addEventListener("load", function () {
  const bg = document.querySelector(".world-universe-earth:not(.reveal-gray-overlay)");
  const gray = document.querySelector(".world-universe-earth.reveal-gray-overlay");
  const wrap = document.querySelector(".miku-float-wrap");
  const black = document.querySelector(".miku-float-wrap .reveal-black-overlay");

  if (!bg || !gray || !wrap || !black) return;

  /* Lock the initial post-opening state. */
  bg.style.setProperty("opacity", "1", "important");
  bg.style.setProperty("filter", "none", "important");
  bg.style.setProperty("transform", "scale(1.10)", "important");
  bg.style.setProperty("animation", "none", "important");

  gray.style.setProperty("opacity", "1", "important");
  gray.style.setProperty("filter", "grayscale(1) brightness(.72)", "important");
  gray.style.setProperty("transform", "scale(1)", "important");
  gray.style.setProperty("animation", "none", "important");

  wrap.style.setProperty("opacity", "1", "important");
  wrap.style.setProperty("transform", "none", "important");
  wrap.style.setProperty("animation", "none", "important");

  black.style.setProperty("opacity", "1", "important");
  black.style.setProperty("filter", "brightness(0) contrast(1.05)", "important");
  black.style.setProperty("animation", "none", "important");

  /* Opening ends, then color restoration + background pull happen together. */
  setTimeout(function () {
    bg.style.setProperty("transition", "transform .95s cubic-bezier(.16,1,.3,1)", "important");
    gray.style.setProperty("transition", "opacity .82s cubic-bezier(.16,1,.3,1)", "important");
    black.style.setProperty("transition", "opacity .72s cubic-bezier(.16,1,.3,1)", "important");

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        /* Background pulls backward while its gray cover disappears. */
        bg.style.setProperty("transform", "scale(1.00)", "important");
        gray.style.setProperty("opacity", "0", "important");

        /* The real-color Miku underneath is revealed at the same moment. */
        black.style.setProperty("opacity", "0", "important");
      });
    });
  }, 6250);
});
</script>
